# Throwaway: where does arm64 software emulation (QEMU TCG) run fastest?
name: Probe arm64 emulation speed
on:
  push:
    branches: [probe/nested-virt]
permissions:
  contents: read
jobs:
  tcg:
    name: ${{ matrix.runner }} cpu=${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        cpu: ["max,pauth-impdef=on", neoverse-n1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm >/dev/null
          qemu-system-aarch64 --version | head -1
          nproc; lscpu | grep -E 'Model name' || true
      - name: Ubuntu 22.04 arm64 kernel and initrd
        run: |
          base=https://cloud-images.ubuntu.com/jammy/current/unpacked
          curl -fsSL -o vmlinuz "$base/jammy-server-cloudimg-arm64-vmlinuz-generic"
          curl -fsSL -o initrd "$base/jammy-server-cloudimg-arm64-initrd-generic"
          file vmlinuz initrd
      - name: Boot under TCG and time it
        run: |
          python3 tcg-bench.py qemu-system-aarch64 -machine virt,gic-version=3 -accel tcg,thread=multi \
            -cpu "${{ matrix.cpu }}" -smp "$(nproc)" -m 2048 -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd -append "console=ttyAMA0 rdinit=/bin/sh panic=-1" \
            | tee bench.log
          grep RESULT bench.log >> "$GITHUB_STEP_SUMMARY"
